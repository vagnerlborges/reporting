# Configuração do Alembic — FUNDAÇÃO de migrations (revisão de arquitetura #5).
#
# A URL do banco NÃO é definida aqui de propósito: o env.py a resolve em runtime a
# partir de `backend.config.settings.get_settings().database_url` (fonte única,
# fail-closed de segredos). Deixar `sqlalchemy.url` vazio evita duplicar/vazar credenciais.
#
# Escopo desta fundação: opera SOMENTE no schema `public`. Migrations por-tenant
# (schema-per-tenant) ficam FORA desta branch — ver migrations/README.md.

[alembic]
script_location = migrations
# Formato do arquivo de versão: timestamp + slug, facilita ordenação cronológica.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# Separador explicito: sem ele o Alembic faz o split legado (espaco, virgula, DOIS-PONTOS)
# e um caminho absoluto de Windows (C:\...) seria partido ao meio.
path_separator = os
# sqlalchemy.url deixado em branco — resolvido no env.py (ver comentário acima).
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
