# Configuração do Alembic — cadeia POR TENANT (REP-56, decisão de 28/08/2026).
#
# Cadeia separada da do schema `admin` (alembic.ini): cada schema `tenant_<slug>` registra a
# PRÓPRIA `alembic_version` (`version_table_schema`), e o laço sobre tenants é do runner —
# nunca de dentro da migration.
#
# Exige `-x tenant=<schema>`; sem isso o env.py falha imediatamente (ver migrations_tenant/env.py).
#   alembic -c alembic_tenant.ini -x tenant=tenant_dattos upgrade head
#
# Como no alembic.ini, `sqlalchemy.url` fica vazio de propósito: o env.py resolve a URL em
# runtime por `backend.config.settings` (fonte única, fail-closed de segredos).

[alembic]
script_location = migrations_tenant
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
# Separador explicito: sem ele o Alembic faz o split legado (espaco, virgula, DOIS-PONTOS)
# e um caminho absoluto de Windows (C:\...) seria partido ao meio.
path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
